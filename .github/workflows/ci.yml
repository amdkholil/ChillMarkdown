name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    name: Check & build (${{ matrix.os.rider }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - { rider: linux, target: ubuntu-latest }
          - { rider: windows, target: windows-latest }
          - { rider: macos, target: macos-latest }
    runs-on: ${{ matrix.os.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview/build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: bun install
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - name: cargo check
        working-directory: src-tauri
        run: cargo check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Tauri build (debug, tanpa bundling penuh)
        working-directory: src-tauri
        run: cargo build
